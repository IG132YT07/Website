<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Train Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #1e3c72;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    input {
      padding: 14px 18px;
      font-size: 1.1rem;
      border: 2px solid #ccc;
      border-radius: 12px;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #2a5298;
    }

    button[type="submit"] {
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #1e3c72;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button[type="submit"]:hover {
      background: #0f2b4c;
    }

    .popular {
      margin-top: 10px;
      text-align: left;
    }

    .popular h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .chip {
      display: inline-block;
      background: #eef3fc;
      color: #1e3c72;
      padding: 8px 14px;
      margin: 4px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #c9d8f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chip:hover {
      background: #dce6f5;
    }

    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #777;
    }

    .note a {
      color: #2a5298;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚆 Indian Train Status</h1>
    <p class="subtitle">Enter any train number to check live location & full route</p>

    <form id="trainForm">
      <div class="input-group">
        <input 
          type="text" 
          id="trainNumber" 
          placeholder="e.g., 12129" 
          pattern="[0-9]{5}" 
          title="Please enter a 5-digit train number"
          required
        />
        <button type="submit">🔍 Check Live Status</button>
      </div>
    </form>

    <div class="popular">
      <h3>Popular Trains</h3>
      <button class="chip" onclick="openTrain('12129')">12129 – Azad Hind Exp</button>
      <button class="chip" onclick="openTrain('12951')">12951 – Mumbai Rajdhani</button>
      <button class="chip" onclick="openTrain('12301')">12301 – Howrah Rajdhani</button>
      <button class="chip" onclick="openTrain('12627')">12627 – Karnataka Exp</button>
      <button class="chip" onclick="openTrain('12259')">12259 – Sealdah Duronto</button>
    </div>

    <p class="note">
      You will be redirected to <strong>Where is my Train</strong> for real-time status.  
      <a href="#" onclick="openTrain('12129'); return false;">Try example</a>
    </p>
  </div>

  <script>
    function openTrain(number) {
      // Clean input
      number = number.toString().trim();
      
      // Validate: 5 digits (Indian train numbers are usually 5 digits)
      if (/^\d{5}$/.test(number)) {
        // Open Where is my Train in a new tab
        window.open('https://www.whereismytrain.in/train/' + number, '_blank');
      } else {
        alert('Please enter a valid 5-digit train number.\nExample: 12129');
      }
    }

    document.getElementById('trainForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('trainNumber');
      openTrain(input.value);
      input.value = '';
    });
  </script>
</body>
</html>
